server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors vite.config.ts's dev proxy: the frontend always calls
    # `${VITE_API_BASE_URL}/...` which defaults to `/api`, so the same
    # frontend build works unmodified against dev (Vite proxy) and
    # production (this nginx proxy) -- both strip `/api` before forwarding
    # to the FastAPI backend, which sends no CORS headers of its own.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (used by /api/ws/notifications)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # MJPEG camera stream (/api/cameras/{id}/stream) needs unbuffered,
        # long-lived responses -- buffering would delay/batch frames.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
