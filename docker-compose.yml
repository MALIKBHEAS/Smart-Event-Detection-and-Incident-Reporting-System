name: smart-event-detection

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-smart_event_detection}
  WORKER_MANAGER_TYPE: ${WORKER_MANAGER_TYPE:-real}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-smart_event_detection}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-smart_event_detection}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- development profile: hot reload, source bind-mounted ------------------
  backend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: dev
    environment: *backend-env
    networks:
      default:
        aliases: [backend]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/srv/backend
      - evidence-data:/srv/backend/evidence
    depends_on:
      db:
        condition: service_healthy

  frontend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    environment:
      VITE_API_BASE_URL: /api
      VITE_BACKEND_ORIGIN: http://backend:8000
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend-dev

  # --- production profile: built images, no bind mounts -----------------------
  backend:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: production
    restart: unless-stopped
    environment: *backend-env
    networks:
      default:
        aliases: [backend]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - evidence-data:/srv/backend/evidence
    depends_on:
      db:
        condition: service_healthy

  frontend:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  db-data:
  evidence-data:
  frontend-node-modules:
