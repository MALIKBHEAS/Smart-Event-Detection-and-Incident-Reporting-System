version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: sedirs
      POSTGRES_PASSWORD: sedirs
      POSTGRES_DB: sedirs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"

  api:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - minio
    environment:
      DATABASE_URL: postgresql+asyncpg://sedirs:sedirs@postgres:5432/sedirs
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_SECRET: change_me
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
    ports:
      - "8000:8000"
    volumes:
      - ./:/app

  fusion_worker:
    build: .
    command: python -m src.workers.fusion_worker
    depends_on:
      - api
      - rabbitmq
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://sedirs:sedirs@postgres:5432/sedirs
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/

  celery_worker:
    build: .
    command: celery -A src.celery_app.celery_app worker --loglevel=info
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://sedirs:sedirs@postgres:5432/sedirs
      REDIS_URL: redis://redis:6379/0

  celery_beat:
    build: .
    command: celery -A src.celery_app.celery_app beat --loglevel=info
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://sedirs:sedirs@postgres:5432/sedirs
      REDIS_URL: redis://redis:6379/0

volumes:
  pgdata:
