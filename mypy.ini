[mypy]
python_version = 3.12
# Allow missing imports (third-party libs without stubs) to avoid noisy CI failures
ignore_missing_imports = True
# Be reasonably strict about types but allow some untyped defs to ease adoption
warn_unused_ignores = True
disallow_untyped_defs = False
check_untyped_defs = False
warn_return_any = True
warn_unused_configs = True

# Only check the backend package
files = backend
